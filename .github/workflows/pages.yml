name: Déploiement GitHub Pages

# Le jeu est un site statique : rien à compiler, on publie le dépôt tel quel.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; un nouveau push annule celui en cours.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier les sprites et l'équilibrage
        run: node tools/simulate.mjs 1

      - name: Préparer Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
